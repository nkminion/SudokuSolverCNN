<!DOCTYPE html>

<html>
	<head>
		<title>
			SudokuSolverCNN
		</title>
		<link rel="stylesheet" href="StyleSheet.css">
		<link rel="icon" type="image/png" href="Favicon.png">
	</head>
	<body>
		<h1>
			Sudoku Solver
		</h1>
		<div class="Container">
			<div class="Side">
				<p class="Text">
					Upload an image
				</p>
				<img id="Preview" src="PlaceHolderImage.png">
				<br>
				<input type="file" id="FileInput" accept="image/*">
				<button id="Upload">
					Upload
				</button>
			</div>
			<div class="Side">
				<p class="Text">
					Result
				</p>
				<div id="SudokuGrid"></div>
				<br>
				<button id="Start">
					Start
				</button>
			</div>
		</div>
		<script src="Script.js"></script>
	</body>
</html>
